[package]
name = "ryna-wow-app"
description = "Ryna, the World of Warcraft: Forever companion app: signs in, watches the game's files and pushes them while it is open."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 needs 1.90, one past the workspace's floor.
rust-version = "1.90"

[[bin]]
name = "ryna-wow-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anyhow.workspace = true
ryna-agent = { path = "../../host" }
ryna-wow-core = { path = "../../../cores/wow/core" }
serde.workspace = true
serde_json.workspace = true
# Versions are exact: the Tauri CLI refuses a crate whose major.minor differs from its npm
# package (package.json pins @tauri-apps/api 2.12 and @tauri-apps/plugin-dialog 2.8 to match).
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
# The in-app updater (GitHub Releases latest.json, minisign-verified): driven from Rust only, so
# it has no npm package. The relaunch after a macOS install is the core AppHandle::restart.
tauri-plugin-updater = "=2.14.1"
# Remembers the window's size and position between runs (Rust side only: no npm package, no
# capability). 2.5 is the line built against Tauri 2.12; `frame.rs` checks what it restores.
tauri-plugin-window-state = "=2.5.0"

[dev-dependencies]
tempfile.workspace = true
