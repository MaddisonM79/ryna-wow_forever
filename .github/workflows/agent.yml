# The agent: format, lint and test on every OS it ships for, smoke-test the CLI there, and build
# the desktop app's installers. Releases are release.yml's (on a `v*` tag).
name: agent

on:
  push:
    branches: [main]
    paths: ["agent/**", "scripts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "scripts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the agent is developed on; bump it on purpose, not when stable moves.
  RUST_TOOLCHAIN: "1.98"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The CLI as built, against the fixtures and a fake `Program Files (x86)\World of Warcraft`
      # tree: --version, parse (JSON), combat, and install discovery through `status --install`.
      - run: cargo build --locked -p ryna-wow
      - name: Smoke-test the CLI
        shell: bash
        run: scripts/smoke-cli.sh "target/debug/ryna-wow${{ runner.os == 'Windows' && '.exe' || '' }}"
      # The release scripts' tests, and that the versions agree (the tag is checked at release).
      - if: runner.os == 'Linux'
        run: node --test scripts/
      - if: runner.os == 'Linux'
        run: node scripts/check-versions.mjs

  # The desktop app (agent/app, crate ryna-wow-app): its web frontend, then fmt, clippy, tests
  # and the installers (.dmg on macOS, the NSIS .exe on Windows), unsigned and without an
  # updater key (that's release.yml's).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: agent/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agent/app
      - run: pnpm test
        working-directory: agent/app
      # vue-tsc, then vite: the app crate embeds agent/app/dist, so it must exist before cargo runs.
      - run: pnpm build
        working-directory: agent/app
      - run: cargo fmt -p ryna-wow-app --check
      - run: cargo clippy -p ryna-wow-app --all-targets --locked -- -D warnings
      - run: cargo test -p ryna-wow-app --locked
      - run: pnpm tauri build --ci
        working-directory: agent/app
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist-app
          cp target/release/bundle/dmg/*.dmg dist-app/ 2>/dev/null || true
          cp target/release/bundle/nsis/*.exe dist-app/ 2>/dev/null || true
          ls -l dist-app
          test -n "$(ls dist-app)"
      - uses: actions/upload-artifact@v4
        with:
          name: ryna-app-${{ matrix.os }}
          path: dist-app/*
