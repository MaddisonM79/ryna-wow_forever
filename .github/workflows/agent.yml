# The agent: format, lint and test on every OS it ships for; build and attach the CLI on a tag.
name: agent

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["agent/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the agent is developed on; bump it on purpose, not when stable moves.
  RUST_TOOLCHAIN: "1.98"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p ryna-wow --target ${{ matrix.target }}
      - name: Name the binary for its target
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ryna-wow${{ matrix.exe }}" "dist/ryna-wow-${{ matrix.target }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ryna-wow-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # The desktop app (agent/app, crate ryna-wow-app): its web frontend, then fmt, clippy, tests
  # and the installers (.dmg on macOS, the NSIS .exe on Windows). Unsigned for now.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: agent/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agent/app
      - run: pnpm test
        working-directory: agent/app
      # vue-tsc, then vite: the app crate embeds agent/app/dist, so it must exist before cargo runs.
      - run: pnpm build
        working-directory: agent/app
      - run: cargo fmt -p ryna-wow-app --check
      # Unlocked until Cargo.lock carries the app's dependencies: the first run adds them and the
      # macOS job hands the lockfile back as an artifact to commit (then add --locked here, as the
      # check job has).
      - run: cargo clippy -p ryna-wow-app --all-targets --locked -- -D warnings
      - run: cargo test -p ryna-wow-app --locked
      - if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-Cargo.lock
          path: Cargo.lock
      - if: matrix.os == 'macos-latest'
        run: cargo build --release -p ryna-wow
      - if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ryna-wow-cli-macos
          path: target/release/ryna-wow
      - run: pnpm tauri build --ci
        working-directory: agent/app
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist-app
          cp target/release/bundle/dmg/*.dmg dist-app/ 2>/dev/null || true
          cp target/release/bundle/nsis/*.exe dist-app/ 2>/dev/null || true
          ls -l dist-app
          test -n "$(ls dist-app)"
      - uses: actions/upload-artifact@v4
        with:
          name: ryna-app-${{ matrix.os }}
          path: dist-app/*

  app-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ryna-app-*
          path: dist-app
          merge-multiple: true
      - name: Attach the installers to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The release job may be creating the same release at the same moment: if create loses
        # that race, the release exists, which is all this needs.
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" dist-app/* --repo "$GITHUB_REPOSITORY" --clobber
