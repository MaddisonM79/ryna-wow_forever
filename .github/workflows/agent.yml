# The agent: format, lint and test on every OS it ships for, smoke-test the CLI there, and build
# the desktop app's installers. Releases are release.yml's (on a `v*` tag).
name: agent

on:
  push:
    branches: [main]
    paths: ["agent/**", "cores/**", "mods/**", "scripts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "cores/**", "mods/**", "scripts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the agent is developed on; bump it on purpose, not when stable moves.
  RUST_TOOLCHAIN: "1.98"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The CLI as built, against the fixtures and a fake `Program Files (x86)\World of Warcraft`
      # tree: --version, parse (JSON), combat, and install discovery through `status --install`.
      - run: cargo build --locked -p ryna
      - name: Smoke-test the CLI
        shell: bash
        run: scripts/smoke-cli.sh "target/debug/ryna${{ runner.os == 'Windows' && '.exe' || '' }}"
      # The release scripts' tests, and that the versions agree (the tag is checked at release).
      - if: runner.os == 'Linux'
        run: node --test scripts/release.test.mjs
      - if: runner.os == 'Linux'
        run: node scripts/check-versions.mjs

  # The desktop app (agent/app, crate ryna-wow-app): its web frontend, then fmt, clippy, tests
  # and the installers (.dmg on macOS, the NSIS .exe on Windows, the AppImage on Linux), unsigned
  # and without an updater key (that's release.yml's).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # What Tauri 2 needs on Ubuntu (release.yml has the same list): the webview, the tray
      # library, SVG icons, and patchelf for the AppImage.
      - name: "Linux: the webview and tray libraries"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: agent/app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: agent/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agent/app
      - run: pnpm test
        working-directory: agent/app
      # vue-tsc, then vite: the app crate embeds agent/app/dist, so it must exist before cargo runs.
      - run: pnpm build
        working-directory: agent/app
      - run: cargo fmt -p ryna-wow-app --check
      - run: cargo clippy -p ryna-wow-app --all-targets --locked -- -D warnings
      - run: cargo test -p ryna-wow-app --locked
      - run: pnpm tauri build --ci
        working-directory: agent/app
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist-app
          cp target/release/bundle/dmg/*.dmg dist-app/ 2>/dev/null || true
          cp target/release/bundle/nsis/*.exe dist-app/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage dist-app/ 2>/dev/null || true
          ls -l dist-app
          test -n "$(ls dist-app)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ryna-app-${{ matrix.os }}
          path: dist-app/*
