# The agent: format, lint and test on every OS it ships for; build and attach the CLI on a tag.
name: agent

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["agent/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "Cargo.toml", "Cargo.lock", ".github/workflows/agent.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the agent is developed on; bump it on purpose, not when stable moves.
  RUST_TOOLCHAIN: "1.98"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p ryna-wow --target ${{ matrix.target }}
      - name: Name the binary for its target
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ryna-wow${{ matrix.exe }}" "dist/ryna-wow-${{ matrix.target }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ryna-wow-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
