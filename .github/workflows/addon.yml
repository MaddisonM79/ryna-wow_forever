name: addon

on:
  push:
    branches: [main]
    paths: ["cores/wow/addon/**", "mods/wow/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["cores/wow/addon/**", "mods/wow/**", ".github/workflows/addon.yml"]

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 luarocks
          # Pinned, its dependencies too: the versions CI installed unpinned on 2026-11-09.
          sudo luarocks install argparse 0.7.2-1
          sudo luarocks install luafilesystem 1.9.0-1
          sudo luarocks install luacheck 1.2.0-1
      # Both addons: the core's and every mod's (Ryna_Chronicle first).
      - run: luacheck cores/wow/addon/ mods/wow/ --config cores/wow/addon/.luacheckrc --no-color
      - name: Every addon file parses as Lua 5.1
        run: |
          shopt -s nullglob
          for f in cores/wow/addon/Ryna/*.lua cores/wow/addon/Ryna/Locales/*.lua mods/wow/*/addon/*/*.lua mods/wow/*/addon/*/Locales/*.lua; do
            luac5.1 -p "$f" || exit 1
          done
      - name: Every translatable string is in its addon's Locales/enUS.lua and the locale templates
        run: node cores/wow/addon/tools/strings.mjs
      # The core's and each mod's behaviour against a fake client (cores/wow/addon/test/*_test.lua,
      # mods/wow/<id>/test/*_test.lua), under Lua 5.1.
      - name: The core's and the mods' tests
        run: |
          shopt -s nullglob
          for t in cores/wow/addon/test/*_test.lua mods/wow/*/test/*_test.lua; do
            lua5.1 "$t" || exit 1
          done
