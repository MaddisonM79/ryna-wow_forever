# The cargo workspace: the agent's host library (agent/host, crate ryna-agent), the WoW core
# (cores/wow/core, crate ryna-wow-core), the command-line binary, and the desktop app
# (agent/app/src-tauri) that drives the core through the host's interface.
[workspace]
resolver = "2"
members = ["agent/host", "cores/wow/core", "agent/cli", "agent/app/src-tauri"]
# A bare `cargo build|clippy|test` covers the host, the core and the CLI only: the app needs its web
# frontend built first (agent/app: `pnpm build`) and the webview's system libraries, so it's
# built by name (`-p ryna-wow-app`) or through `pnpm tauri`.
default-members = ["agent/host", "cores/wow/core", "agent/cli"]

[workspace.package]
version = "0.3.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/MaddisonM79/ryna_agent"
# std::fs::File::try_lock (the run lock) is 1.89.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
# Standard base64 for the device key, its signatures and the seed kept in the keychain.
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
# The device key (docs/ryna-agent-cores-mods.md 7.1): Ed25519, minted with the OS RNG.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# gzip for the combat digests and raw segments (already in the tree through Tauri).
flate2 = "1"
# This machine's name for the heartbeat, from the OS in-process (no `hostname` child process,
# whose fork would hold the run lock's open file a moment longer; see state_dir::try_lock_named).
gethostname = "1"
# keyring 3: the OS keychain on each target. On Linux the Secret Service (gnome-keyring, KeePassXC,
# KWallet) over zbus, which is pure Rust (no libdbus, so CI needs no system libraries), with the
# kernel keyring as the cache, and alone when no Secret Service answers (see auth::KeyringStore).
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native-async-persistent",
  "async-io",
  "crypto-rust",
] }
# Blocking, rustls with the webpki roots: no OpenSSL to link on any target.
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
